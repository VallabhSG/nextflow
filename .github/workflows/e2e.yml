name: E2E

# Runs the Playwright E2E suite against a deployed instance of the app.
# Triggered manually (recommended) or on demand. It tests against a live
# backend, so it intentionally does NOT run on every push by default.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment URL to test (defaults to the E2E_BASE_URL secret / production)"
        required: false
        type: string
      live_run:
        description: "Also run the billable live-run tests (Trigger.dev + Gemini)"
        required: false
        type: boolean
        default: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ inputs.base_url || secrets.E2E_BASE_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          E2E_LIVE_RUN: ${{ inputs.live_run && '1' || '' }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
